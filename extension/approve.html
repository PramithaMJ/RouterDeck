<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Allow router access?</title>
<link rel="stylesheet" href="ui.css" />
</head>
<body>
  <main class="card">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 64 64"><path d="M18 27a20 20 0 0 1 28 0M23 33a12.5 12.5 0 0 1 18 0" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/><circle cx="32" cy="46" r="5" fill="#f2632a"/></svg>
    </div>
    <h1>Allow router access?</h1>
    <p class="muted">This website wants to manage your router through the RouterDeck extension.</p>
    <dl>
      <dt>Website</dt><dd id="site"></dd>
      <dt>Router</dt><dd id="router"></dd>
    </dl>
    <p class="note">It will be able to read your router's settings and change them while you're signed in. Only allow websites you trust. You can revoke access any time from the extension icon.</p>
    <div class="actions">
      <button id="deny" class="secondary">Don't allow</button>
      <button id="allow" class="primary">Allow</button>
    </div>
  </main>
  <script src="approve.js"></script>
</body>
</html>
