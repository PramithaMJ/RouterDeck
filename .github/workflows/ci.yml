name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  bridges:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Syntax-check extension, connector and desktop app
        run: |
          for f in extension/*.js connector/*.mjs desktop/src/*.js desktop/scripts/*.mjs; do node --check "$f"; done
          node -e 'require("./desktop/electron-builder.cjs")'
          node -e 'JSON.parse(require("fs").readFileSync("extension/manifest.json","utf8"))'
